<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>TrillionaireFX</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23111827'/%3E%3Cpath d='M6 22l6-7 5 4 9-11' stroke='%234c9aff' stroke-width='3' fill='none'/%3E%3C/svg%3E">
</head>
<body data-view="chart">
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <defs>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V4M4 20h16"/><path d="M8 15l4-4 3 3 5-6"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.8" fill="currentColor"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="5" cy="6" r="1" fill="currentColor"/><circle cx="5" cy="12" r="1" fill="currentColor"/><circle cx="5" cy="18" r="1" fill="currentColor"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/><circle cx="12" cy="12" r="6.5"/></symbol>
    <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.5a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.5v.7"/><circle cx="12" cy="16.8" r="0.9" fill="currentColor"/></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="18.5" cy="12" r="1.6" fill="currentColor"/></symbol>
    <symbol id="i-cursor" viewBox="0 0 24 24"><path d="M6 4l12 7-5.5 1.5L10 18z"/></symbol>
    <symbol id="i-cross" viewBox="0 0 24 24"><path d="M12 3v7M12 14v7M3 12h7M14 12h7"/></symbol>
    <symbol id="i-hline" viewBox="0 0 24 24"><path d="M3 12h18"/><circle cx="7" cy="12" r="1.6" fill="currentColor"/></symbol>
    <symbol id="i-trend" viewBox="0 0 24 24"><path d="M4 19L20 5"/><circle cx="4.5" cy="18.5" r="1.6" fill="currentColor"/><circle cx="19.5" cy="5.5" r="1.6" fill="currentColor"/></symbol>
    <symbol id="i-rect" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1.5"/></symbol>
    <symbol id="i-ruler" viewBox="0 0 24 24"><path d="M3.5 15.5l12-12 5 5-12 12z"/><path d="M7.5 11.5l2 2M10.5 8.5l2 2M13.5 5.5l2 2"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 6h14M12 6v13M9 19h6"/></symbol>
    <symbol id="i-long" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
    <symbol id="i-short" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
    <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M8 19l-4-4 9.5-9.5a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L11 18.5"/><path d="M8 19h12M8.5 10.5l5 5"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4.5"/><circle cx="12" cy="17" r="0.9" fill="currentColor"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></symbol>
  </defs>
</svg>
<div id="app" class="layout">
  <!-- ============================== TOP BAR ============================== -->
  <header class="topbar" role="banner">
    <div class="brand" aria-label="TrillionaireFX">Trillionaire<span>FX</span></div>
    <label class="sr-only" for="symbolSearch">Symbol</label>
    <input id="symbolSearch" class="search" list="symbolList" placeholder="Symbol…" autocomplete="off"
           aria-label="Search symbol">
    <datalist id="symbolList"></datalist>
    <div class="chartCtl">
      <div id="tfBar" class="seg tf" role="group" aria-label="Timeframe"></div>
      <div class="seg ctype" role="group" aria-label="Chart type">
        <button data-ctype="candles" class="active" title="Candles">Candles</button>
        <button data-ctype="bars" title="Bars">Bars</button>
        <button data-ctype="line" title="Line">Line</button>
        <button data-ctype="ha" title="Heikin Ashi">HA</button>
      </div>
      <div class="menu">
        <button id="indBtn" aria-haspopup="true" aria-expanded="false">Indicators <svg class="ico" aria-hidden="true"><use href="#i-chevron"/></svg></button>
        <div id="indMenu" class="dropdown" role="menu" hidden></div>
      </div>
    </div>
    <div class="spacer"></div>
    <div id="acct" class="acct">
      <label class="mini">Balance <input id="balanceInput" type="number" inputmode="decimal" min="1" step="1" aria-label="Account balance"></label>
      <span id="ccyLabel" class="muted"></span>
      <label class="mini">Risk % <input id="riskInput" type="number" inputmode="decimal" min="0.05" max="1" step="0.05" aria-label="Risk per trade percent"></label>
      <button id="themeBtn" class="icon" title="Toggle light/dark theme" aria-label="Toggle theme"><svg class="ico" aria-hidden="true"><use href="#i-theme"/></svg></button>
      <button id="settingsBtn" class="icon" title="Settings" aria-label="Settings"><svg class="ico" aria-hidden="true"><use href="#i-gear"/></svg></button>
      <button id="helpBtn" class="icon hide-touch" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts"><svg class="ico" aria-hidden="true"><use href="#i-help"/></svg></button>
    </div>
    <div class="menu">
      <button id="bellBtn" class="icon" aria-label="Alerts" title="Alerts"><svg class="ico" aria-hidden="true"><use href="#i-bell"/></svg><span id="bellCount" class="badge" hidden>0</span></button>
      <div id="bellMenu" class="dropdown wide" hidden></div>
    </div>
    <button id="moreBtn" class="icon only-phone" aria-label="Account and settings" aria-expanded="false" aria-controls="acct"><svg class="ico" aria-hidden="true"><use href="#i-dots"/></svg></button>
  </header>

  <!-- ============================== LEFT TOOLBAR ============================== -->
  <nav class="toolbar" aria-label="Drawing tools">
    <button data-tool="cursor" class="active" title="Cursor (Esc)" aria-label="Cursor"><svg class="ico" aria-hidden="true"><use href="#i-cursor"/></svg></button>
    <button data-tool="crosshair" title="Crosshair" aria-label="Crosshair"><svg class="ico" aria-hidden="true"><use href="#i-cross"/></svg></button>
    <button data-tool="hline" title="Horizontal line (Alt+H)" aria-label="Horizontal line"><svg class="ico" aria-hidden="true"><use href="#i-hline"/></svg></button>
    <button data-tool="trendline" title="Trend line (Alt+T)" aria-label="Trend line"><svg class="ico" aria-hidden="true"><use href="#i-trend"/></svg></button>
    <button data-tool="rect" title="Rectangle (Alt+R)" aria-label="Rectangle"><svg class="ico" aria-hidden="true"><use href="#i-rect"/></svg></button>
    <button data-tool="measure" title="Measure (Alt+M)" aria-label="Measure"><svg class="ico" aria-hidden="true"><use href="#i-ruler"/></svg></button>
    <button data-tool="text" title="Text note (Alt+N)" aria-label="Text note"><svg class="ico" aria-hidden="true"><use href="#i-text"/></svg></button>
    <button data-tool="long" title="Long position (Alt+L)" aria-label="Long position tool"><svg class="ico" aria-hidden="true"><use href="#i-long"/></svg></button>
    <button data-tool="short" title="Short position (Alt+S)" aria-label="Short position tool"><svg class="ico" aria-hidden="true"><use href="#i-short"/></svg></button>
    <button data-tool="eraser" title="Eraser (Alt+E)" aria-label="Eraser"><svg class="ico" aria-hidden="true"><use href="#i-eraser"/></svg></button>
  </nav>

  <!-- ============================== CHART ============================== -->
  <main class="chartArea" aria-label="Price chart">
    <div id="regimeBanner" class="regime" role="status"></div>
    <div id="legend" class="legend" aria-live="polite"></div>
    <div id="chartNote" class="chartNote" hidden></div>
    <div id="chartWrap" class="chartWrap">
      <div id="chart"></div>
      <canvas id="overlay" aria-hidden="true"></canvas>
    </div>
    <div id="chartState" class="state" hidden></div>
  </main>

  <!-- ============================== RIGHT SIDEBAR ============================== -->
  <aside class="sidebar" aria-label="Watchlist and signal">
    <section class="watchlist">
      <h2>Watchlist</h2>
      <table id="watchTable" aria-label="Watchlist">
        <thead><tr><th>Symbol</th><th>Status</th><th>Grade</th><th>Score</th><th>Chg</th></tr></thead>
        <tbody><tr><td colspan="5" class="muted">Loading…</td></tr></tbody>
      </table>
    </section>
    <section id="signalPanel" class="signal" aria-live="polite">
      <div class="muted">Select a symbol.</div>
    </section>
  </aside>

  <!-- ============================== BOTTOM PANEL ============================== -->
  <section class="bottom" aria-label="Panels">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="trades" class="active">Open Trades</button>
      <button role="tab" data-tab="signals">Signals History</button>
      <button role="tab" data-tab="journal">Journal</button>
      <button role="tab" data-tab="validation">How reliable is this?</button>
      <button role="tab" data-tab="mindset">Mindset</button>
      <button role="tab" data-tab="missed">Missed Opportunities</button>
      <button role="tab" data-tab="execution">Execution</button>
      <button role="tab" data-tab="paper">Paper Trading</button>
      <button role="tab" data-tab="replay">Replay</button>
      <button role="tab" data-tab="quality">Data Quality</button>
      <button role="tab" data-tab="settings">Settings</button>
    </div>
    <div id="tabBody" class="tabBody" role="tabpanel"></div>
  </section>

  <!-- ============================== PHONE NAV ============================== -->
  <nav class="mnav" aria-label="Sections">
    <button data-view="chart" class="active"><svg class="ico" aria-hidden="true"><use href="#i-chart"/></svg>Chart</button>
    <button data-view="signal"><svg class="ico" aria-hidden="true"><use href="#i-target"/></svg>Signal</button>
    <button data-view="watch"><svg class="ico" aria-hidden="true"><use href="#i-list"/></svg>Watchlist</button>
    <button data-view="more"><svg class="ico" aria-hidden="true"><use href="#i-grid"/></svg>More</button>
  </nav>

  <footer class="footer" role="contentinfo">
    <strong>Educational decision support. Trading carries risk of loss. Past performance does not guarantee future results.</strong>
    <span class="muted">TrillionaireFX never places trades. Charts by TradingView Lightweight Charts™ (Apache-2.0).</span>
  </footer>
</div>

<!-- ============================== DIALOGS ============================== -->
<dialog id="modal" aria-modal="true"><div id="modalBody"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>window.TFX_STATIC = true;</script>
<script src="/vendor/lightweight-charts.standalone.production.js"></script>
<script src="/app.js"></script>
</body>
</html>
